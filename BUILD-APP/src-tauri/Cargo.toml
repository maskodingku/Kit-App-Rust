[package]
name = "kit_app_rust_app"
version = "1.0.0"
description = "Kit App Rust Portable Desktop Application"
authors = ["Kit App Rust"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "kit_app_rust_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "Kit-App-Rust"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4" }
tauri-plugin-log = "2"
